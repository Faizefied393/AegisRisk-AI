name: Quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'streamlit>=1.40,<2' 'pandas>=2.2,<3' 'requests>=2.32,<3' 'pytest>=8,<10' 'ruff>=0.9,<1'
      - run: python -m pytest -q
      - run: ruff check .
